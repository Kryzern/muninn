[package]
name = "muninn"
version = "0.4.0"
description = "Search your photos by describing them. Offline, fast, private."
license = "MIT"
authors = ["Ethan Dsouza (Kryzern)"]
edition = "2021"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "rayon"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
walkdir = "2.5.0"
windows = { version = "0.61", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "Globalization", "Win32_System_WinRT", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Variant", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemServices", "Win32_System_Diagnostics_Debug", "Win32_Security", "Win32_UI_Shell_PropertiesSystem"] }
sha2 = "0.10.9"
windows-numerics = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
embed-resource = "3.0.12"
